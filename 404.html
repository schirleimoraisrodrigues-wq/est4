<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Engenharia - redirecionando</title>
    <script>
      (function () {
        var validRoutes = ['login', 'cadastro', 'calendario', 'materias', 'tarefas', 'questoes', 'flashcards', 'perfil'];
        var cleanPath = window.location.pathname.replace(/\/$/, '');
        var segments = cleanPath.split('/').filter(Boolean);
        var lastSegment = segments[segments.length - 1] || '';
        var route = validRoutes.indexOf(lastSegment) >= 0 ? '/' + lastSegment : '/';
        var baseSegments = route === '/' ? segments : segments.slice(0, -1);
        var base = '/' + baseSegments.join('/');
        if (base !== '/') base += '/';
        window.location.replace(window.location.origin + base + '#' + route + window.location.search + window.location.hash);
      }());
    </script>
  </head>
  <body>
    <p>Redirecionando para o Terminal Engenharia...</p>
  </body>
</html>
